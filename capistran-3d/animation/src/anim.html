<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {Sky} from 'three/addons/objects/Sky.js';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1280,H=+q.get('h')||720;
const renderer=new THREE.WebGLRenderer({antialias:q.get('aa')==='1',preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=q.get('soft')==='1'?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;
const scene=new THREE.Scene();
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const gltf=await new GLTFLoader().loadAsync('model.glb');
const root=gltf.scene; scene.add(root);
const zy=(x,y,z)=>new THREE.Vector3(x,z,-y);
// ---------- lights: fixed set (no shader recompiles)
const pend=[], accent=[], bollard=[], rm=[]; let bi=0;
root.traverse(o=>{ if(!o.isLight) return;
  if(o.name.startsWith('L_Pendant')){pend.push(o);} else if(o.name.startsWith('L_Accent')){accent.push(o);} else if(o.name.startsWith('L_Bollard')){ if((bi++)%3===0) bollard.push(o); else rm.push(o);} else rm.push(o);});
rm.forEach(o=>o.parent.remove(o));
[...pend,...accent,...bollard].forEach(o=>{o.userData.base=o.intensity; o.intensity=0; o.decay=2; o.castShadow=false;});
const lum=[]; root.traverse(o=>{ if(o.name&&o.name.startsWith('Pendant_')&&!o.isLight){ lum.push(o);} });
lum.forEach(n=>{ n.traverse(c=>{ if(c.isMesh&&/Emissive/.test(c.material.name)){ c.material=c.material.clone(); n.userData.em=c.material; } }); });
const ang=p=>Math.atan2(-p.z,p.x);
lum.sort((a,b)=>ang(a.position)-ang(b.position));
const grp=[]; const pl=[...pend]; pend.length=0; pl.forEach(o=>o.parent.remove(o));
for(let g=0; g<10; g++){ const members=lum.filter((_,i)=>Math.floor(i*10/lum.length)===g);
  const c=new THREE.Vector3(); members.forEach(m=>c.add(m.position)); c.divideScalar(Math.max(1,members.length));
  const sp=new THREE.SpotLight(0xffc58f,0,0,THREE.MathUtils.degToRad(55),0.6,2); sp.position.copy(c); sp.target.position.set(c.x,0,c.z); scene.add(sp); scene.add(sp.target);
  sp.userData.members=members; sp.userData.base=240*members.length; grp.push(sp);}
const neon=[]; for(let i=0;i<8;i++){ const a=(i+0.5)/8*Math.PI*2; const p=new THREE.PointLight(0xffe7cf,0,0,2); p.position.copy(zy(-2+11.0*Math.cos(a),11.0*Math.sin(a),10.2)); if(p.position.x>-12.6){scene.add(p); neon.push(p);} }
const lantern=new THREE.PointLight(0xffecd6,0,0,2); lantern.position.copy(zy(0,0,14.2)); scene.add(lantern);
const portalGlow=new THREE.PointLight(0xffc890,0,0,2); portalGlow.position.copy(zy(-11,0,4)); scene.add(portalGlow);
// ---------- materials to animate
const mats={diff:[],neon:[],plexi:[],stain:[],all:new Set()};
root.traverse(o=>{ if(!o.isMesh) return; const m=o.material; mats.all.add(m); const tr=m.transparent||/Glass|Plexi/.test(m.name);
  o.castShadow=!tr && !/Emissive/.test(m.name); o.receiveShadow=true;
  if(m.alphaTest>0){o.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:m.map,alphaTest:0.5});}
  if(/Glass_Clear|Clerestory/.test(m.name)){m.opacity=0.16; m.metalness=0; m.roughness=0.05; m.depthWrite=false;}
  if(/Plexi/.test(m.name)){m.opacity=0.85; m.emissive=new THREE.Color(0xffffff); m.depthWrite=false; if(!mats.plexi.includes(m))mats.plexi.push(m);}
  if(/Stained/.test(m.name)){m.emissive=new THREE.Color(0xffffff); m.emissiveMap=m.map; m.transparent=false; m.opacity=1; if(!mats.stain.includes(m))mats.stain.push(m);}
  if(/Emissive_Diffuser/.test(m.name) && !mats.diff.includes(m)) mats.diff.push(m);
  if(/Emissive_Neon/.test(m.name) && !mats.neon.includes(m)) mats.neon.push(m);
});
// ---------- sky, sun, hemi
const sky=new Sky(); sky.scale.setScalar(5000); scene.add(sky); const su=sky.material.uniforms;
su.turbidity.value=4; su.rayleigh.value=1.3; su.mieCoefficient.value=0.004; su.mieDirectionalG.value=0.82;
const sun=new THREE.DirectionalLight(0xffffff,3); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-45;sc.right=45;sc.top=45;sc.bottom=-45;sc.near=1;sc.far=300; sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.04;
scene.add(sun); scene.add(sun.target);
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x5a4a3a,0.6); scene.add(hemi);
const fill=new THREE.PointLight(0xffe2c4,0,0,1.2); fill.position.copy(zy(0,0,9)); scene.add(fill);
const cam=new THREE.PerspectiveCamera(40,W/H,0.05,4000);
// overlay canvas
const oc=document.createElement('canvas'); oc.width=W; oc.height=H; document.body.appendChild(oc); const ctx=oc.getContext('2d');
renderer.domElement.style.display='none'; document.body.appendChild(renderer.domElement);
// ---------- helpers
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)); const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=cl((x-a)/(b-a)); return t*t*(3-2*t);};
const pw=(t,keys)=>{ if(t<=keys[0][0]) return keys[0][1]; for(let i=1;i<keys.length;i++){ if(t<=keys[i][0]){const [t0,v0]=keys[i-1],[t1,v1]=keys[i]; const u=(t-t0)/(t1-t0); return v0+(v1-v0)*u;} } return keys[keys.length-1][1];};
const cr=(pts,u)=>{ const n=pts.length-1; const x=cl(u)*n; const i=Math.min(n-1,Math.floor(x)); const f=x-i;
  const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(n,i+2)];
  return p1.map((_,k)=>0.5*((2*p1[k])+(-p0[k]+p2[k])*f+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*f*f+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*f*f*f));};
const ease=u=>u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const sm=u=>u*u*(3-2*u);
// ---------- shots (model coords: x east, y north, z up)
function shot(t){
  if(t<24){ const u=sm(t/24); const a=THREE.MathUtils.degToRad(lerp(140,222,u)); const r=lerp(78,56,u), h=lerp(46,24,u);
    return {cam:[r*Math.cos(a),r*Math.sin(a),h], tgt:[0,0,lerp(2,5,u)], lens:lerp(32,30,u)}; }
  if(t<46){ const u=(t-24)/22; const a=THREE.MathUtils.degToRad(lerp(-15,-108,sm(u))); const r=lerp(30,27,u);
    return {cam:[r*Math.cos(a),r*Math.sin(a),1.7], tgt:[0,0,lerp(8.6,7.8,u)], lens:17}; }
  if(t<70){ const u=sm((t-46)/24); return {cam:cr([[-27.5,-13.5,3.2],[-26,-7,2.2],[-24,-2,1.75],[-21.5,0,1.7]],u), tgt:cr([[-8,2,7.0],[-11,1,6.5],[-13,0,5.8],[-12,0,5.2]],u), lens:lerp(22,24,u)}; }
  if(t<100){ const u=(t-70)/30;
    const cp=cr([[-12.2,0,1.6],[-9,0,1.6],[-5.5,0,1.6],[-3.0,-0.4,1.6],[-2.0,-0.6,1.6]],sm(cl(u/0.62)));
    const up=ss(0.55,0.88,u);
    const tg=[lerp(8,0,up),0,lerp(4.6,16,up)]; return {cam:cp,tgt:tg,lens:lerp(17,15,up)}; }
  { const u=sm((t-100)/20); return {cam:cr([[-21,-6,1.7],[-26,3,4.5],[-36,17,13],[-48,30,24]],u), tgt:[lerp(-13,0,u),0,lerp(5,6,u)], lens:lerp(22,30,u)}; }
}
// ---------- time of day
const elevK=[[0,50],[24,40],[46,22],[58,8],[68,-1],[80,-6],[100,-11],[120,-13]];
const azK=[[0,215],[46,265],[70,302],[120,320]];
const clockK=[[0,15.5],[24,17.0],[46,19.0],[68,21.25],[100,22.4],[120,23.1]];
let inside=false;
window.renderFrame=(t)=>{
  const e=pw(t,elevK), az=pw(t,azK);
  const phi=THREE.MathUtils.degToRad(90-e), th=THREE.MathUtils.degToRad(az);
  const sd=new THREE.Vector3(Math.sin(phi)*Math.sin(th),Math.cos(phi),-Math.sin(phi)*Math.cos(th));
  su.sunPosition.value.copy(sd);
  const day=ss(-6,14,e), sunUp=ss(-1.5,6,e), warm=1-ss(4,26,e);
  sun.position.copy(sd).multiplyScalar(120); sun.intensity=3.2*sunUp*(0.55+0.45*ss(3,20,e));
  sun.color.setRGB(1, lerp(0.95,0.62,warm), lerp(0.88,0.36,warm));
  hemi.intensity=lerp(0.035,0.6,day); hemi.color.setRGB(lerp(0.12,0.75,day),lerp(0.16,0.85,day),lerp(0.32,1.0,day));
  const envI=lerp(0.02,0.35,day); mats.all.forEach(m=>{m.envMapIntensity=envI;});
  // artificial lights
  const neonL=ss(52,57,t), lanL=ss(54,58,t), bolL=ss(57,62,t), accL=ss(86,90,t);
  lum.forEach((n,i)=>{ const st=72+i*(10/lum.length); const v=ss(st,st+0.7,t); n.userData.lv=v; if(n.userData.em) n.userData.em.emissiveIntensity=0.25+14*v; });
  grp.forEach(sp=>{ const v=sp.userData.members.reduce((a,m)=>a+m.userData.lv,0)/Math.max(1,sp.userData.members.length); sp.intensity=sp.userData.base*v; });
  // (pendants glow dimly from dusk outside, then ignite one by one inside)
  neon.forEach(p=>p.intensity=70*neonL); lantern.intensity=160*lanL;
  accent.forEach(o=>o.intensity=o.userData.base*1.2*accL);
  bollard.forEach(o=>o.intensity=o.userData.base*4.0*bolL);
  const s=shot(t); const c=s.cam;
  const k = t<24?0:t<46?1:t<70?2:t<100?3:4;
  const vis=(arr,on)=>arr.forEach(l=>l.visible=on);
  vis(grp,k===3); vis(accent,k===3); vis(neon,k>=2); lantern.visible=k>=2; vis(bollard,k===2||k===4);
  portalGlow.visible=(k===2||k===4); fill.visible=(k===3); sun.visible=k<=2 || k===3;
  inside = c[0]>-12.9 && Math.hypot(c[0]+2,c[1])<14 && c[2]<11;
  portalGlow.intensity = inside?0: 220*ss(55,66,t);
  fill.intensity = inside? 60*day : 0;
  mats.diff.forEach(m=>{m.emissiveIntensity=0.3+12*bolL;});
  mats.neon.forEach(m=>{m.emissiveIntensity=0.3+14*neonL;});
  mats.plexi.forEach(m=>{m.emissiveIntensity= inside? (1.3*day+0.12*lanL*(1-day)) : (0.25*day+1.4*lanL*(1-day));});
  mats.stain.forEach(m=>{m.emissiveIntensity= inside? 0.95*day+0.05 : 0.15*day+0.65*neonL*(1-day);});
  renderer.toneMappingExposure = inside? lerp(1.25,1.0,day) : lerp(1.5,1.0,day);
  // camera
  cam.position.copy(zy(...c)); cam.up.set(0,1,0); cam.lookAt(zy(...s.tgt));
  const hf=2*Math.atan(36/2/s.lens); cam.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(hf/2)/(W/H))); cam.updateProjectionMatrix();
  renderer.render(scene,cam);
  // overlay + fades
  ctx.drawImage(renderer.domElement,0,0);
  const cuts=[24,46,70,100]; let f=1; cuts.forEach(k=>{f=Math.min(f,cl(Math.abs(t-k)/0.45));}); f=Math.min(f,cl(t/1.2),cl((120-t)/2.0));
  if(f<1){ctx.fillStyle=`rgba(0,0,0,${1-f})`; ctx.fillRect(0,0,W,H);}
  const hh=Math.floor(pw(t,clockK)), mm=Math.floor((pw(t,clockK)-hh)*60);
  ctx.globalAlpha=0.9*f; ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=6;
  ctx.font=`500 ${Math.round(H*0.026)}px Helvetica, Arial, sans-serif`; ctx.fillText('St. Johann von Capistran  ·  München  ·  Sep Ruf 1960', W*0.035, H*0.93);
  ctx.font=`300 ${Math.round(H*0.045)}px Helvetica, Arial, sans-serif`; ctx.fillText(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`, W*0.035, H*0.875);
  const ttl = t<24?'Day':t<46?'Afternoon · circuitus':t<70?'Dusk · lights on':t<100?'Night · interior':'Night';
  ctx.font=`400 ${Math.round(H*0.022)}px Helvetica, Arial, sans-serif`; ctx.textAlign='right'; ctx.fillText(ttl, W*0.965, H*0.93); ctx.textAlign='left';
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  return oc.toDataURL('image/jpeg',0.93);
};
window.__ready=true;
</script></body></html>
