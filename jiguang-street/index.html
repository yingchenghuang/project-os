<title>繼光街街屋模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* VOICE everyday tool for architecture, curation and public-art study
   IDEA a 1930s Taichung Sakae-machi street you can rebuild facade by facade, then flip to today
   PICTURE the live three.js street: two rows of arcaded shophouses facing a narrow road
   COLOUR lime plaster ground, soot ink, brick red lead, wash-stone grey support, painted-window green accent
   TYPE Noto Serif TC for names and plaques, Noto Sans TC for controls
   LAYOUT laptop: control column left 360px, street fills the rest; phone: street on top 56svh, controls below */
:root{color-scheme:light dark;--bg:light-dark(#f3eee4,#1b1916);--panel:light-dark(#fbf8f2,#24211d);--ink:light-dark(#27211b,#efe8dc);--soft:light-dark(#6d6254,#b4a996);--line:light-dark(#ddd3c3,#3d3831);--brick:light-dark(#a3402b,#e0775d);--stone:light-dark(#cfc7b7,#57514a);--green:light-dark(#2f5b48,#7fc0a2)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:360px minmax(0,1fr);height:100%}
#stage{position:relative;order:2;background:#9cc7e4;overflow:hidden}
#view{position:absolute;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px 14px;pointer-events:none}
.hud.top{top:0}
.hud.bottom{bottom:0;align-items:flex-end;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.hud>*{pointer-events:auto}
.tag{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink);backdrop-filter:blur(6px)}
#readout{font-variant-numeric:tabular-nums}
#panel{order:1;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 20px max(28px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
h1{font:900 34px/1.05 "Noto Serif TC",serif;letter-spacing:-.02em;margin:0 0 8px}
.lede{margin:0 0 16px;color:var(--soft);font-size:14px}
h2{font:900 21px/1.2 "Noto Serif TC",serif;margin:22px 0 2px;display:flex;gap:8px;align-items:baseline}
h2 small{font:500 13px "Noto Sans TC",sans-serif;color:var(--soft)}
.sec{border-top:1px solid var(--line);margin-top:18px}
.field{display:grid;gap:6px;margin-top:14px}
.field>span,.rng>span{font-size:13px;color:var(--soft);display:flex;justify-content:space-between}
.field output,.rng output{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=text]{font:500 16px "Noto Serif TC",serif;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--bg)}
.seg button{flex:1 1 auto;min-height:36px;padding:4px 9px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:500 14px "Noto Sans TC",sans-serif;cursor:pointer;white-space:nowrap}
.seg button:hover{background:color-mix(in srgb,var(--stone) 45%,transparent)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.hud .seg{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px)}
.hud .seg button{min-height:34px;font-size:13px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chips button{min-height:44px;text-align:left;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:600 14px "Noto Serif TC",serif;cursor:pointer;line-height:1.25}
.chips button small{display:block;font:400 12px "Noto Sans TC",sans-serif;color:var(--soft)}
.chips button[aria-pressed=true]{border-color:var(--brick);box-shadow:inset 0 0 0 1px var(--brick)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer}
.sw button[aria-pressed=true]{outline:2px solid var(--brick);outline-offset:2px}
.rng{display:grid;gap:4px;margin-top:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--stone)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--stone)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:4px;background:var(--brick);border:2px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:4px;background:var(--brick);border:2px solid var(--panel)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:14px}
.checks label{display:flex;gap:8px;align-items:center;min-height:32px;font-size:14px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--brick)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
.acts button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px "Noto Sans TC",sans-serif;cursor:pointer}
.acts button.main{background:var(--brick);border-color:var(--brick);color:#fff}
.acts button:hover{filter:brightness(1.06)}
.note{font-size:13px;color:var(--soft);margin:18px 0 0}
.note b{color:var(--ink);font-weight:500}
#toast{min-height:20px;font-size:13px;color:var(--green);margin-top:8px}
@media(max-width:760px){
body{overflow:auto}
html,body{height:auto}
#app{grid-template-columns:minmax(0,1fr);grid-template-rows:56svh auto;height:auto}
#stage{order:1;position:sticky;top:0;z-index:2}
#panel{order:2;border-right:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint{display:none}
h1{font-size:30px}
}
</style>

<div id="app">
  <section id="stage" aria-label="繼光街 3D 街景">
    <div id="view"></div>
    <div class="hud top">
      <p class="tag hint">點選任一棟街屋開始編輯，拖曳旋轉，滾輪或雙指縮放</p>
      <div class="seg" id="views" role="group" aria-label="視角">
        <button data-view="street" aria-pressed="true">街道</button>
        <button data-view="front" aria-pressed="false">正立面</button>
        <button data-view="air" aria-pressed="false">鳥瞰</button>
      </div>
    </div>
    <div class="hud bottom"><span class="tag" id="readout">載入中</span></div>
  </section>

  <aside id="panel">
    <h1>繼光街街屋</h1>
    <p class="lede">日治時期台中「榮町」連棟街屋的參數化立面模擬。調整山頭、窗型、亭仔腳與材料，再切到今日，看招牌與鐵皮如何蓋住它。</p>

    <div class="seg" id="era" role="group" aria-label="年代">
      <button data-era="1935" aria-pressed="true">1935 榮町</button>
      <button data-era="today" aria-pressed="false">今日繼光街</button>
    </div>
    <label class="rng"><span>時刻 <output id="hourOut">15:00</output></span><input id="hour" type="range" min="6" max="20" step="0.25" value="15"></label>

    <div class="sec">
      <h2><span id="selName">林記吳服店</span><small id="selNo">北側第 1 棟</small></h2>
      <div class="two">
        <label class="field"><span>店號</span><input type="text" id="name" maxlength="6" autocomplete="off"></label>
        <label class="field"><span>落成年號</span><input type="text" id="year" maxlength="6" autocomplete="off"></label>
      </div>

      <div class="field"><span>樣式範本</span>
        <div class="chips" id="presets">
          <button data-preset="baroque">大正巴洛克<small>紅磚、拱窗、渦捲山頭</small></button>
          <button data-preset="brick">紅磚洋風<small>弧拱窗、圓拱山頭</small></button>
          <button data-preset="showa">昭和簡化<small>洗石子、方窗、階梯山頭</small></button>
          <button data-preset="wayo">和洋折衷<small>灰泥、三角山頭</small></button>
        </div>
      </div>

      <div class="field"><span>山頭</span>
        <div class="seg" data-k="gable" role="group" aria-label="山頭">
          <button data-v="baroque">巴洛克</button><button data-v="arch">圓拱</button><button data-v="triangle">三角</button><button data-v="stepped">階梯</button><button data-v="none">無</button>
        </div>
      </div>
      <label class="rng"><span>山頭高度 <output data-o="gableH"></output></span><input type="range" data-k="gableH" min="0.6" max="2.6" step="0.1"></label>

      <div class="field"><span>窗型</span>
        <div class="seg" data-k="win" role="group" aria-label="窗型">
          <button data-v="arch">圓拱窗</button><button data-v="segment">弧拱窗</button><button data-v="rect">方窗</button>
        </div>
      </div>
      <div class="two">
        <div class="field"><span>每層窗數</span>
          <div class="seg" data-k="wins" role="group" aria-label="每層窗數"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div>
        </div>
        <div class="field"><span>樓層</span>
          <div class="seg" data-k="floors" role="group" aria-label="樓層"><button data-v="2">2 層</button><button data-v="3">3 層</button></div>
        </div>
      </div>

      <label class="rng"><span>面寬 <output data-o="width"></output></span><input type="range" data-k="width" min="3.6" max="6.6" step="0.1"></label>
      <label class="rng"><span>層高 <output data-o="floorH"></output></span><input type="range" data-k="floorH" min="3.2" max="4.4" step="0.1"></label>
      <label class="rng"><span>亭仔腳深度 <output data-o="depth"></output></span><input type="range" data-k="depth" min="2.4" max="4.5" step="0.1"></label>

      <div class="field"><span>亭仔腳開口</span>
        <div class="seg" data-k="arcade" role="group" aria-label="亭仔腳開口"><button data-v="arch">弧拱</button><button data-v="flat">平樑</button></div>
      </div>
      <div class="field"><span>牆面材料</span>
        <div class="seg" data-k="material" role="group" aria-label="牆面材料"><button data-v="brick">清水紅磚</button><button data-v="wash">洗石子</button><button data-v="plaster">灰泥粉刷</button></div>
      </div>
      <div class="field"><span>粉刷色</span>
        <div class="sw" data-k="wall" role="group" aria-label="粉刷色"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" data-k="pilasters">壁柱</label>
        <label><input type="checkbox" data-k="medallion">山頭家徽</label>
        <label><input type="checkbox" data-k="balcony">二樓陽台</label>
        <label><input type="checkbox" data-k="baluster">花瓶欄杆</label>
      </div>

      <div class="acts">
        <button class="main" id="applyAll">套用到整排</button>
        <button id="randOne">隨機這一棟</button>
        <button id="randAll">重組整條街</button>
        <button id="copy">複製參數 JSON</button>
      </div>
      <p id="toast" role="status"></p>
    </div>

    <p class="note"><b>史料脈絡</b>　繼光街在日治時期屬「榮町」，鄰近台中驛，是當時最繁榮的商圈，吳服、餐廳、時計與雜貨店林立；民族路口的「西洋軒」於 1915 年開業。山頭店號依當時習慣由右至左書寫。</p>
    <p class="note">店號與年號為示意。尺寸取台灣日治街屋常見範圍：面寬約 4 至 6 公尺，亭仔腳約 3 至 4 公尺，並非逐棟測繪。</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const STREET=10.6,MID=5.3,BODY=14;
const NAMES=['林記吳服店','榮町時計店','新高商行','丸三雜貨','振興布莊','金泉珈琲','協和藥房','大和寫真館','錦榮食堂','合發米店','太陽堂書局','光明眼鏡','永和茶行','共榮洋品','福住旅館','美香餅舖'];
const YEARS=['大正九年','大正十二年','大正十四年','昭和三年','昭和五年','昭和八年','昭和十年'];
const WALLS=['#ece3cf','#d6e2d8','#efd5c4','#dedbd2','#e6cd94'];
const SIGNS=['越南河粉','印尼小吃','手機配件','國際電話卡','泰式奶茶','外幣兌換','卡拉OK','美甲','服飾批發','珍珠奶茶','菲律賓餐','行李箱','當舖','補習班','金飾'];
const SIGNC=['#d62828','#f2b705','#1d4ed8','#0f8a5f','#ff6b00','#7b2cbf','#e11d74'];
const PRESETS={
 baroque:{gable:'baroque',gableH:2.0,win:'arch',wins:2,floors:3,arcade:'arch',material:'brick',pilasters:true,medallion:true,balcony:false,baluster:true},
 brick:{gable:'arch',gableH:1.4,win:'segment',wins:2,floors:2,arcade:'flat',material:'brick',pilasters:true,medallion:false,balcony:true,baluster:true},
 showa:{gable:'stepped',gableH:1.1,win:'rect',wins:3,floors:3,arcade:'flat',material:'wash',pilasters:false,medallion:false,balcony:false,baluster:false},
 wayo:{gable:'triangle',gableH:1.3,win:'rect',wins:2,floors:2,arcade:'flat',material:'plaster',pilasters:true,medallion:true,balcony:true,baluster:false}
};
let seed=20261126;
const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const pick=a=>a[Math.floor(rnd()*a.length)];
const col=h=>new THREE.Color(h).convertSRGBToLinear();
function makeHouse(i,preset){
 const k=preset||pick(Object.keys(PRESETS));
 return Object.assign({name:NAMES[i%NAMES.length],year:pick(YEARS),preset:k,width:+(4.2+rnd()*1.8).toFixed(1),floorH:+(3.5+rnd()*.5).toFixed(1),depth:3.6,wall:pick(WALLS)},PRESETS[k]);
}

/* ---------- renderer ---------- */
const view=$('#view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x9cc7e4,70,230);
const camera=new THREE.PerspectiveCamera(45,1,.1,500);
camera.position.set(-14,1.7,8);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.495;controls.minDistance=2;controls.maxDistance=140;
controls.target.set(0,5,0);
const hemi=new THREE.HemisphereLight(0xdfeaf5,0x8a7a62,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dc,2.4);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:200});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
scene.add(sun,sun.target);sun.target.position.set(0,0,MID);

/* ---------- textures ---------- */
function canvasTex(S,draw){const c=document.createElement('canvas');c.width=c.height=S;draw(c.getContext('2d'),S);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const tr=(()=>{let s=7;return()=>(s=s*16807%2147483647)/2147483647})();
const brickTex=canvasTex(512,(g,S)=>{g.fillStyle='#cbbfac';g.fillRect(0,0,S,S);const rows=14,cols=4,rh=S/rows,cw=S/cols;for(let r=0;r<rows;r++){const off=(r%2)*cw/2;for(let c=-1;c<=cols;c++){g.fillStyle=`hsl(${9+tr()*9},${46+tr()*14}%,${33+tr()*11}%)`;g.fillRect(c*cw+off+2,r*rh+2,cw-4,rh-4)}}for(let i=0;i<5000;i++){g.fillStyle=`rgba(${tr()<.5?0:255},${tr()<.5?0:230},0,${tr()*.08})`;g.fillRect(tr()*S,tr()*S,2,2)}});
const washTex=canvasTex(256,(g,S)=>{g.fillStyle='#ebe7df';g.fillRect(0,0,S,S);for(let i=0;i<7000;i++){const v=150+tr()*105|0;g.fillStyle=`rgb(${v},${v-4},${v-12})`;g.beginPath();g.arc(tr()*S,tr()*S,.6+tr()*1.6,0,7);g.fill()}});
const plasterTex=canvasTex(256,(g,S)=>{g.fillStyle='#f6f4f0';g.fillRect(0,0,S,S);for(let i=0;i<260;i++){g.fillStyle=`rgba(90,80,60,${tr()*.05})`;g.beginPath();g.arc(tr()*S,tr()*S,4+tr()*22,0,7);g.fill()}});
const tinTex=canvasTex(128,(g,S)=>{for(let x=0;x<S;x++){const v=200+Math.sin(x/S*Math.PI*16)*40|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,0,1,S)}for(let i=0;i<300;i++){g.fillStyle=`rgba(120,60,20,${tr()*.15})`;g.fillRect(tr()*S,tr()*S,2+tr()*6,1+tr()*10)}});
const groundTex=canvasTex(256,(g,S)=>{g.fillStyle='#fff';g.fillRect(0,0,S,S);for(let i=0;i<4000;i++){const v=180+tr()*75|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(tr()*S,tr()*S,2,2)}});
groundTex.repeat.set(60,60);
const texCache={};
function textTex(key,w,h,draw){if(texCache[key])return texCache[key];const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return texCache[key]=t}
const SERIF='"Noto Serif TC","Songti TC","PMingLiU",serif';
function plaqueTex(name,year){return textTex('pl'+name+year,512,200,(g,w,h)=>{g.fillStyle='#efe9dc';g.fillRect(0,0,w,h);g.strokeStyle='#6b5a44';g.lineWidth=6;g.strokeRect(12,12,w-24,h-24);const ch=[...name].reverse(),n=ch.length,fs=Math.min(104,(w-60)/n*.92);g.fillStyle='#2a2119';g.font=`900 ${fs}px ${SERIF}`;g.textAlign='center';g.textBaseline='middle';ch.forEach((c,i)=>g.fillText(c,30+(w-60)*(i+.5)/n,h*.42));g.font=`600 34px ${SERIF}`;g.fillStyle='#4e4130';g.fillText([...year].reverse().join(''),w/2,h*.8)})}

 $$('#views button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));
}

/* ---------- UI ---------- */
const sw=$('.sw');sw.innerHTML=WALLS.map(c=>`<button data-v="${c}" style="background:${c}" aria-label="粉刷色 ${c}"></button>`).join('');
const units={gableH:'m',width:'m',floorH:'m',depth:'m'};
function syncUI(){const p=houses[sel].p;
 $('#selName').textContent=p.name;$('#selNo').textContent=`${houses[sel].row?'南':'北'}側第 ${rows[houses[sel].row].indexOf(sel)+1} 棟`;
 $('#name').value=p.name;$('#year').value=p.year;
 $$('[data-k]').forEach(el=>{const k=el.dataset.k,v=p[k];
  if(el.matches('.seg,.sw'))el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v)===String(v)));
  else if(el.type==='checkbox')el.checked=!!v;
  else if(el.type==='range'){el.value=v;$(`[data-o="${k}"]`).textContent=`${(+v).toFixed(1)} ${units[k]}`}});
 $$('#presets button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.preset===p.preset));
 const{T}=heights(p);$('#readout').textContent=`${p.name}｜面寬 ${p.width.toFixed(1)} m｜簷高 ${T.toFixed(1)} m｜山頭頂 ${(T+.24+(p.gable==='none'?.95:.95+p.gableH)).toFixed(1)} m｜亭仔腳 ${p.depth.toFixed(1)} m`;
}
let pend=new Set(),raf=0;
function queue(i){pend.add(i);if(!raf)raf=requestAnimationFrame(()=>{raf=0;pend.forEach(build);pend.clear();layout();applyLight();syncUI()})}
function setP(k,v){const p=houses[sel].p;p[k]=v;if(k!=='name'&&k!=='year')p.preset=null;queue(sel)}
$$('.seg[data-k],.sw[data-k]').forEach(el=>el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;setP(el.dataset.k,/^\d+$/.test(v)?+v:v)}));
$$('input[type=range][data-k]').forEach(el=>el.addEventListener('input',()=>setP(el.dataset.k,+el.value)));
$$('input[type=checkbox][data-k]').forEach(el=>el.addEventListener('change',()=>setP(el.dataset.k,el.checked)));
['name','year'].forEach(k=>$('#'+k).addEventListener('input',e=>{const v=e.target.value.trim();if(!v)return;houses[sel].p[k]=v;queue(sel);fontsFor(v)}));
$('#presets').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;Object.assign(houses[sel].p,PRESETS[b.dataset.preset],{preset:b.dataset.preset});queue(sel)});
$('#era').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;era=b.dataset.era;applyEra()});
$('#hour').addEventListener('input',e=>{hour=+e.target.value;applyLight()});
$('#views').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view)});
const toast=t=>{$('#toast').textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').textContent='',2600)};
$('#applyAll').addEventListener('click',()=>{const p=houses[sel].p,r=houses[sel].row;rows[r].forEach(i=>{if(i===sel)return;const q=houses[i].p;Object.assign(q,{gable:p.gable,gableH:p.gableH,win:p.win,wins:p.wins,floors:p.floors,floorH:p.floorH,depth:p.depth,arcade:p.arcade,material:p.material,pilasters:p.pilasters,medallion:p.medallion,balcony:p.balcony,baluster:p.baluster,preset:p.preset});queue(i)});toast('已套用到同一側整排，店號與面寬保留各自原樣');});
$('#randOne').addEventListener('click',()=>{seed=(Date.now()%100000)+7;const n=makeHouse(sel);n.name=houses[sel].p.name;houses[sel].p=n;queue(sel)});
$('#randAll').addEventListener('click',()=>{seed=(Date.now()%100000)+11;houses.forEach((h,i)=>{const nm=h.p.name;h.p=makeHouse(i);h.p.name=nm;queue(i)});toast('整條街已重組')});
$('#copy').addEventListener('click',async()=>{const txt=JSON.stringify(houses[sel].p,null,2);try{await navigator.clipboard.writeText(txt);toast('已複製這棟的參數')}catch(e){toast('瀏覽器不允許複製，請改用參數截圖')}});

/* picking */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const r=renderer.domElement.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
 const hit=ray.intersectObjects(houses.filter(h=>h.g.visible).map(h=>h.g),true).find(x=>x.object.userData.house!==undefined&&x.object.visible);
 if(hit&&hit.object.userData.house!==sel){sel=hit.object.userData.house;attachMarker();syncUI()}});

/* fonts → redraw text textures */
function fontsFor(t){if(!document.fonts)return;const spec=`900 40px "Noto Serif TC"`;if(document.fonts.check(spec,t))return;document.fonts.load(spec,t).then(()=>{Object.keys(texCache).forEach(k=>{if(k.includes(t)){texCache[k].dispose();delete texCache[k]}});houses.forEach((h,i)=>{if(h.p.name.includes(t)||h.p.year.includes(t))queue(i)})}).catch(()=>{})}
function fontsAll(){if(!document.fonts)return;const all=NAMES.join('')+YEARS.join('')+'0123456789';Promise.all([document.fonts.load(`900 40px "Noto Serif TC"`,all),document.fonts.load(`600 30px "Noto Serif TC"`,all),document.fonts.load(`700 40px "Noto Sans TC"`,SIGNS.join(''))]).then(()=>{Object.keys(texCache).forEach(k=>{texCache[k].dispose();delete texCache[k]});signMats.clear();buildAll();applyLight();applyEra()}).catch(()=>{})}

/* loop */
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<520?58:45;camera.updateProjectionMatrix()}
const ro=new ResizeObserver(resize);ro.observe(view);
function loop(now){requestAnimationFrame(loop);if(tween){const k=Math.min(1,(now-tween.t0)/tween.dur),q=k<.5?2*k*k:1-(-2*k+2)**2/2;camera.position.lerpVectors(tween.from.p,tween.to.p,q);controls.target.lerpVectors(tween.from.t,tween.to.t,q);if(k>=1)tween=null}controls.update();renderer.render(scene,camera)}

function start(d){initHouses();if(d&&Array.isArray(d.ps)&&d.ps.length===16)d.ps.forEach((p,i)=>houses[i].p=Object.assign(houses[i].p,p));if(d&&Number.isInteger(d.sel))sel=d.sel;if(d&&d.era)era=d.era;if(d&&d.hour)hour=d.hour;
 $('#hour').value=hour;buildAll();applyEra();applyLight();syncUI();resize();setView('street');tween&&(tween.dur=1);requestAnimationFrame(loop);fontsAll()}
window.claude?.hot?.snapshot?.(()=>({ps:houses.map(h=>h.p),sel,era,hour}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
